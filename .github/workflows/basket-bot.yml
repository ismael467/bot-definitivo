name: Basket paper-trading bot (ETH, ZEC, XRP)

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: basket-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-basket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar bot de cesta
        run: python src/run_basket.py
      - name: Mantener el cron activo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/basket-bot.yml/enable" || true
      - name: Commit del estado
        run: |
          git config user.name "rsi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/basket_state.json data/basket_trades_log.csv data/basket_metrics.json
          git diff --cached --quiet || git commit -m "basket: actualizar estado ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
